<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Break out the pack: a firmware escape room">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2740" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="#0b1220"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <circle cx="240" cy="170" r="158" fill="url(#glow)"/>

  <!-- battery pack -->
  <g transform="translate(80 95)">
    <rect x="0" y="0" width="320" height="150" rx="16" fill="#111a2e" stroke="#334155" stroke-width="3"/>
    <rect x="320" y="52" width="18" height="46" rx="5" fill="#334155"/>
    <g fill="#1f6f4a">
      <rect x="20" y="22" width="22" height="106" rx="4"/>
      <rect x="49" y="22" width="22" height="106" rx="4"/>
      <rect x="78" y="22" width="22" height="106" rx="4"/>
      <rect x="107" y="22" width="22" height="106" rx="4"/>
      <rect x="136" y="22" width="22" height="106" rx="4"/>
      <rect x="165" y="22" width="22" height="106" rx="4"/>
      <rect x="194" y="22" width="22" height="106" rx="4"/>
      <rect x="223" y="22" width="22" height="106" rx="4" fill="#9a2f2f"/>
      <rect x="252" y="22" width="22" height="106" rx="4"/>
      <rect x="281" y="22" width="22" height="106" rx="4"/>
    </g>
    <!-- padlock -->
    <g transform="translate(118 18)">
      <path d="M22 52V34a20 20 0 0 1 40 0v18" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
      <rect x="4" y="48" width="76" height="62" rx="10" fill="#f59e0b"/>
      <circle cx="42" cy="72" r="8" fill="#0b1220"/>
      <rect x="38" y="76" width="8" height="18" rx="3" fill="#0b1220"/>
    </g>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">
    <circle cx="96" cy="272" r="5" fill="#ef4444"/>
    <text x="108" y="277">LOCKED</text>
    <circle cx="184" cy="272" r="5" fill="#334155"/>
    <text x="196" y="277">ARMED</text>
    <circle cx="264" cy="272" r="5" fill="#334155"/>
    <text x="276" y="277">FREE</text>
  </g>

  <!-- text -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="480" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="4" fill="#f59e0b">MISSION BRIEFING</text>
    <text x="478" y="160" font-size="58" font-weight="800" fill="#f8fafc">BREAK OUT THE PACK</text>
    <text x="480" y="200" font-size="22" fill="#cbd5e1">A rider is stranded and their battery has locked itself.</text>
    <text x="480" y="230" font-size="22" fill="#cbd5e1">Your firmware is the only way in.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="480" y="258" width="98" height="34" rx="17" fill="#13203a" stroke="#334155"/>
    <text x="529" y="280" text-anchor="middle" fill="#e2e8f0">5 rooms</text>
    <rect x="590" y="258" width="98" height="34" rx="17" fill="#13203a" stroke="#334155"/>
    <text x="639" y="280" text-anchor="middle" fill="#e2e8f0">80 min</text>
    <rect x="700" y="258" width="162" height="34" rx="17" fill="#13203a" stroke="#334155"/>
    <text x="781" y="280" text-anchor="middle" fill="#e2e8f0">BLE · FreeRTOS</text>
    <rect x="874" y="258" width="132" height="34" rx="17" fill="#13203a" stroke="#334155"/>
    <text x="940" y="280" text-anchor="middle" fill="#e2e8f0">AI welcome</text>
  </g>
</svg>
